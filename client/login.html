<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - МУИВ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-banner">
        <div class="banner-container">
            <div class="logo-wrapper">
                <img src="img/logo.png" alt="МУИВ Логотип" class="logo">
            </div>
            <div class="banner-actions">
                <a href="index.html" class="btn-primary" style="text-decoration: none;">На главную</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="modal-content" style="margin: 50px auto; border: 1px solid #c0c0c0;">
            <h2 style="text-align: center;">Вход в систему</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="login">Логин:</label>
                    <input type="text" id="login" placeholder="Введите логин" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary form-btn">Войти</button>
            </form>
            <div id="loginError" style="color: #c41230; margin-top: 15px; display: none; text-align: center; font-weight: bold;"></div>
        </div>
    </main>

    <footer style="background-color: #34495e; color: #fff; text-align: center; padding: 15px 0; margin-top: 40px;">
        <div class="banner-container">
            <p style="margin: 0; font-size: 14px;">Разработано: Евсютин Виталий Юрьевич</p>
        </div>
    </footer>
    
    <script src="js/auth.js"></script>
</body>
</html>
